[workspace]
resolver = "2"
members = [
    "crates/daemon",
    "crates/cli",
    "crates/gui-gtk",
    "crates/gui-core",
    "crates/common",
]

[workspace.package]
version = "0.3.0"
# Nothing here is published to crates.io: these are application binaries plus
# their private support crates. Declaring it prevents an accidental
# `cargo publish`, and lets cargo-deny treat the internal path dependencies as
# private rather than as wildcard requirements.
publish = false
edition = "2021"
authors = ["SSH Tunnel Manager Contributors"]
license = "Apache-2.0"
repository = "https://github.com/SchirmForge/ssh-tunnel"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP/REST API
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }

# SSH
# default-features would add `flate2`, which is the only thing putting zlib into
# the negotiated compression list. Dropping it removes the compression
# "zip bomb" class (GHSA-wwx6-x28x-8259) structurally rather than by patch, and
# costs nothing: OpenSSH itself defaults to `Compression no`, and a port forward
# gains essentially nothing from SSH-level compression.
#
# `rsa` stays: users hold RSA keys. It carries RUSTSEC-2023-0071 permanently --
# no fixed version exists in any rsa release -- which is recorded in deny.toml.
# `des` and `dsa` are off by default and listing features explicitly keeps them
# off regardless of what upstream adds to its defaults.
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs", "rsa"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zeroize = { version = "1.8", features = ["derive"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.26", features = ["v4", "serde"] }

# Config directories
dirs = "6.0"

# CLI (for CLI crate)
clap = { version = "4.5", features = ["derive", "cargo"] }
dialoguer = "0.12"
colored = "3.1"

# HTTP client (for CLI and GUI)
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`.
reqwest = { version = "0.13", features = ["json", "stream", "rustls"], default-features = false }

# GTK (for GUI crate)
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }

# Async stream utilities
futures-util = "0.3"

# Test support
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

