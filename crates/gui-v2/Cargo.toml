[package]
name = "ssh-tunnel-gui-v2"
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
publish = false
authors = ["SSH Tunnel Manager Contributors"]
license = "Apache-2.0"
repository = "https://github.com/SchirmForge/ssh-tunnel"
description = "Second-generation GTK 4/libadwaita GUI for SSH Tunnel Manager"

[[bin]]
name = "ssh-tunnel-gui-v2"
path = "src/main.rs"

[dependencies]
ssh-tunnel-gui-core = { path = "../gui-core" }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = "1"

[build-dependencies]
glib-build-tools = "0.22.8"

# Keep Phase 2B completely isolated until the root workspace integration is
# reviewed separately. Remove this table when gui-v2 is added to the parent
# workspace members.
[workspace]
resolver = "2"
