[package]
name = "ssh-tunnel-gui"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Production GTK 4/libadwaita GUI for SSH Tunnel Manager"

[[bin]]
name = "ssh-tunnel-gui"
path = "src/main.rs"

[dependencies]
ssh-tunnel-gui-core = { path = "../gui-core" }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = "1"

[build-dependencies]
glib-build-tools = "0.22.8"
