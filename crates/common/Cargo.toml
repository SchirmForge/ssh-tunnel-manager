[package]
name = "ssh-tunnel-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Async runtime (for SSE event handling)
tokio = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID for profile IDs
uuid = { workspace = true }

# Logging
tracing = { workspace = true }

# Config directories
dirs = { workspace = true }

# HTTP client (for daemon communication)
reqwest = { workspace = true }

# TLS (for client certificate pinning)
rustls = { version = "0.23", features = ["aws-lc-rs"] }
webpki-roots = "1.0"
sha2 = "0.11"
x509-parser = "0.18"

# SSH key inspection (see src/ssh_key.rs). Only this crate needs russh for it,
# so the CLI and GUI do not each pull in an SSH stack of their own.
russh = { workspace = true }

# Keychain/keyring for secure password storage.
#
# keyring 4 renamed its backend features (`linux-native` ->
# `linux-keyutils-keyring-store`, and so on). The per-platform stores are all
# enabled because the crate selects between them by target; only the Linux one
# is exercised today, since that is the only platform this project builds and
# tests on.
keyring = { version = "4.2", features = [
    "linux-keyutils-keyring-store",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
] }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: generates throwaway SSH keys so none are committed. Matched to the
# version russh uses, so no second copy of rand is compiled.
rand = "0.10"
