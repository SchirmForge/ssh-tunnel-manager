# Pin the toolchain so CI and every developer compile with the same rustc.
#
# CI previously used `dtolnay/rust-toolchain@stable`, which floats: a new stable
# release could change behaviour or break the build with no change on our side,
# and nothing verified the minimum version we claim to support.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
